name: Pilot readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/relationship-authorization.mjs
      - run: node tests/clinical-storage.mjs
      - run: node tests/case-lifecycle.mjs
      - run: node tests/followups.mjs
      - run: node tests/structured-prescriptions.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Synthetic mobile and desktop workflows
        run: |
          WORKFLOW_PREVIEW=1 npm run dev -- --port 3109 > /tmp/move-free-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3109/workflow-preview > /dev/null; then break; fi
            sleep 1
          done
          node tests/workflow-browser.mjs
