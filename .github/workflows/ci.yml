name: Pilot readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/relationship-authorization.mjs
      - run: node tests/clinical-storage.mjs
      - run: node tests/private-video-storage.mjs
      - run: node tests/stage2-prescriptions.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
